# omarchy-eq keybindings, pre-Quattro Hyprland config format. Sourced from
# ~/.config/hypr/bindings.conf with:
#     source = ~/.config/omarchy/plugins/jackzasian.eq/plugin/hypr/bindings.conf
#
# On Omarchy Quattro 4.x and newer the bindings live in Lua -- use
# bindings.lua.snippet in this directory instead, and read the note there about
# why the output switcher must be bound by absolute path.
#
# Check the keys are free first:  omarchy menu keybindings --print
bind = SUPER ALT, E, exec, omarchy-eq ab
bind = SUPER ALT SHIFT, E, exec, omarchy-eq-profile

# Cycle the audio OUTPUT past omarchy-eq's per-profile sinks. Absolute path on
# purpose: see bindings.lua.snippet.
bind = SUPER ALT, O, exec, $HOME/.local/bin/omarchy-audio-output-switch
