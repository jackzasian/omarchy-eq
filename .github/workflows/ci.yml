name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately no pip install: the library is stdlib-only and the tests
      # are stdlib unittest, so a bare interpreter is the whole environment.
      - name: unit tests
        run: python -m unittest discover -s tests -t tests -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck bin/omarchy-eq install.sh omarchy/omarchy-eq-term
